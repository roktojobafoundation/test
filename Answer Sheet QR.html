<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />

    <title>RJFSE26 QR Codes – ৪ সারি</title>
    <!-- QRCode.js লাইব্রেরি -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fb;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 2rem 1.5rem;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #1e293b;
            text-align: center;
            margin-bottom: 0.25rem;
            letter-spacing: -0.5px;
        }
        .subtitle {
            text-align: center;
            color: #475569;
            font-size: 1.05rem;
            margin-bottom: 2.5rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1.2rem;
        }
        .subtitle strong {
            background: #dbeafe;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            color: #1d4ed8;
        }
        .section {
            margin-bottom: 3.5rem;
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0f172a;
            padding: 0.5rem 1.5rem;
            background: #ffffff;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            margin-bottom: 1.8rem;
            border-left: 6px solid #2563eb;
        }
        /* === প্রতি সারিতে ঠিক ৪টি কলাম === */
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
            background: #ffffff;
            padding: 1.8rem 1.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef2f6;
            max-width: 900px; /* প্রয়োজনমতো বাড়ানো/কমানো যায় */
            margin: 0 auto;
        }
        .qr-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafcff;
            padding: 0.9rem 0.4rem 0.7rem;
            border-radius: 14px;
            transition: 0.15s ease;
            border: 1px solid #e9edf2;
        }
        .qr-item:hover {
            border-color: #94a3b8;
            background: #f8faff;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.04);
        }
        .qr-item .qr-container {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 10px;
            padding: 4px;
        }
        .qr-item .qr-container canvas,
        .qr-item .qr-container img {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
        }
        .qr-label {
            font-size: 0.68rem;
            font-weight: 500;
            color: #1e293b;
            background: #f1f5f9;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-top: 0.5rem;
            text-align: center;
            word-break: break-all;
            max-width: 100%;
            line-height: 1.3;
            letter-spacing: 0.2px;
        }
        .qr-label small {
            font-weight: 400;
            color: #64748b;
        }
        .footer-note {
            text-align: center;
            margin-top: 2.8rem;
            color: #64748b;
            font-size: 0.95rem;
            background: #f1f4f9;
            padding: 0.9rem 1.5rem;
            border-radius: 40px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .footer-note a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-note a:hover {
            text-decoration: underline;
        }

        /* মোবাইল স্ক্রিনেও ৪ কলাম রাখা (ছোট হলে স্কেল হবে) */
        @media (max-width: 600px) {
            body {
                padding: 1rem 0.5rem;
            }
            .qr-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.6rem;
                padding: 1rem 0.5rem;
                max-width: 100%;
            }
            .qr-item .qr-container {
                width: 70px;
                height: 70px;
            }
            .qr-label {
                font-size: 0.5rem;
                padding: 0.1rem 0.3rem;
            }
            .section-title {
                font-size: 1.3rem;
                padding: 0.3rem 1rem;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
        /* প্রিন্টের জন্য */
        @media print {
            .qr-item {
                break-inside: avoid;
                border: 1px solid #ccc;
                background: #fff !important;
            }
            .qr-grid {
                box-shadow: none;
                border: 1px solid #ddd;
                max-width: 100%;
            }
            .section-title {
                background: #f0f0f0;
            }
            body {
                background: #fff;
                padding: 0.3in;
            }
        }
    </style>
</head>

        // ----------------------------------------------
        // ২. রেন্ডার ফাংশন – প্রতি গ্রিডে QR বসাবে
        // ----------------------------------------------
        function renderQRCodes(containerId, codes) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            codes.forEach((text) => {
                const item = document.createElement('div');
                item.className = 'qr-item';

                const wrapper = document.createElement('div');
                wrapper.className = 'qr-container';

                try {
                    const qrDiv = document.createElement('div');
                    wrapper.appendChild(qrDiv);
                    new QRCode(qrDiv, {
                        text: text,
                        width: 110,
                        height: 110,
                        colorDark: '#0f172a',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } catch (e) {
                    wrapper.textContent = '⚠️';
                    wrapper.style.fontSize = '2rem';
                    console.warn('QR generation failed for:', text, e);
                }

                const label = document.createElement('div');
                label.className = 'qr-label';
                label.textContent = text;

                item.appendChild(wrapper);
                item.appendChild(label);
                container.appendChild(item);
            });
        }

        // ----------------------------------------------
        // ৩. তিনটি সিরিজ রেন্ডার
        // ----------------------------------------------
        renderQRCodes('grid-8', series8);
