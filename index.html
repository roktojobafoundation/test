<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJF Scholarship Examination 2026</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js">
    </script>

    <!-- QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>

    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js">
    </script>

    <style>
        :root {
            --primary: #1a237e;
            --primary-light: #283593;
            --accent: #ff6d00;
            --accent-light: #ff9100;
            --success: #2e7d32;
            --warning: #f9a825;
            --danger: #c62828;
            --info: #0277bd;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #212121;
            --text-light: #616161;
            --border: #e0e0e0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            --gold: #ffb300;
            --silver: #9e9e9e;
            --bronze: #cd7f32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #e8eaf6 0%, #f5f6fa 30%, #e3f2fd 60%, #fce4ec 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.06;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.06;
            }
            90% {
                opacity: 0.06;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
        }

        .app-header {
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1a237e 100%);
            color: #fff;
            border-radius: var(--radius);
            padding: 20px 28px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            animation: slideDown 0.6s ease-out;
        }
        @keyframes slideDown {
            from {
                transform: translateY(-40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .app-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 1;
        }
        .header-logo .logo-icon {
            width: 52px;
            height: 52px;
            background: var(--accent);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(255, 109, 0, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 6px 20px rgba(255, 109, 0, 0.4);
            }
            50% {
                box-shadow: 0 6px 35px rgba(255, 109, 0, 0.7);
            }
        }
        .header-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header-subtitle {
            font-size: 0.8rem;
            opacity: 0.85;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            z-index: 1;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(255, 109, 0, 0.35);
        }
        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 109, 0, 0.45);
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
            transform: translateY(-2px);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 20px;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-info {
            background: var(--info);
            color: #fff;
        }
        .btn-warning {
            background: var(--warning);
            color: #212121;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-ghost:hover {
            background: #f5f5f5;
            border-color: #bdbdbd;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid transparent;
            animation: fadeInUp 0.5s ease-out forwards;
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
            border-color: #e8eaf6;
            transform: translateY(-2px);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card-accent {
            border-left: 4px solid var(--accent);
        }
        .card-header {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }
        .stat-card {
            text-align: center;
            padding: 20px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, #f8f9ff 0%, #fff 100%);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #3949ab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text);
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 15px;
            border: 2px solid var(--border);
            border-radius: 25px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: #fafafa;
            font-family: var(--font);
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.08);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .card-grid {
                grid-template-columns: 1fr;
            }
            .app-header {
                flex-direction: column;
                text-align: center;
            }
            .header-logo {
                flex-direction: column;
            }
        }

        .table-container {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        table th,
        table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        table th {
            background: #f8f9ff;
            font-weight: 700;
            color: var(--primary);
            position: sticky;
            top: 0;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        table tbody tr {
            transition: var(--transition);
        }
        table tbody tr:hover {
            background: #fafbff;
        }
        .trophy-gold {
            background: linear-gradient(135deg, #fff8e1 0%, #fff 50%) !important;
            border-left: 4px solid var(--gold);
        }
        .trophy-silver {
            background: linear-gradient(135deg, #f5f5f5 0%, #fff 50%) !important;
            border-left: 4px solid var(--silver);
        }
        .trophy-bronze {
            background: linear-gradient(135deg, #fbe9e7 0%, #fff 50%) !important;
            border-left: 4px solid var(--bronze);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            padding: 28px;
            max-width: 600px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalPop 0.3s ease;
        }
        @keyframes modalPop {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
        }
        .modal-close:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .badge-warning {
            background: #fff8e1;
            color: #f57f17;
        }
        .badge-info {
            background: #e1f5fe;
            color: #0277bd;
        }
        .badge-danger {
            background: #ffebee;
            color: #c62828;
        }
        .badge-primary {
            background: #e8eaf6;
            color: #1a237e;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #212121;
            color: #fff;
            padding: 14px 22px;
            border-radius: 25px;
            font-weight: 600;
            z-index: 2000;
            animation: slideInRight 0.4s ease, fadeOutRight 0.4s ease 2.6s forwards;
            box-shadow: var(--shadow-lg);
            font-size: 0.9rem;
        }
        .toast-success {
            background: #2e7d32;
        }
        .toast-error {
            background: #c62828;
        }
        @keyframes slideInRight {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes fadeOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }

        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 4px;
        }
        .tab-btn {
            padding: 9px 18px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            border-radius: 20px 20px 0 0;
            transition: var(--transition);
            font-size: 0.85rem;
            color: var(--text-light);
            position: relative;
        }
        .tab-btn.active {
            color: var(--primary);
            background: #e8eaf6;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            border-radius: 3px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .anonymous-badge {
            background: #1a237e;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .anonymous-warning {
            background: #fff3e0;
            border-left: 4px solid #ff6d00;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #e65100;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trophy-icon {
            font-size: 1.3rem;
            vertical-align: middle;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }
        ::-webkit-scrollbar-thumb {
            background: #c5c5c5;
            border-radius: 3px;
        }
        .text-center {
            text-align: center;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .mt-3 {
            margin-top: 18px;
        }
        .mb-3 {
            margin-bottom: 18px;
        }
        .w-full {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="bgParticles"></div>
    <div id="root" class="app-container"><div class="spinner" id="initialLoader"></div></div>
    <div id="toastContainer"></div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBB4caiGCLBbTulWTwV1p5pgjyU_SKjTxI",
            authDomain: "rjfse2026.firebaseapp.com",
            databaseURL: "https://rjfse2026-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rjfse2026",
            storageBucket: "rjfse2026.firebasestorage.app",
            messagingSenderId: "39296282344",
            appId: "1:39296282344:web:6764b39a64e5492a9e235d",
            measurementId: "G-HG228HY13Z"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const rtdb = firebase.database();
        const storage = firebase.storage();

        // ==================== GLOBAL STATE ====================
        const AppState = {
            currentPortal: null,
            adminAuth: null,
            adminAssistAuth: null,
            evalCommitteeAuth: null,
            allStudents: [],
            allAssistants: [],
            allVolunteers: [],
            stats: null,
            resultUploadSession: { scannedAnswerSheetId: null, scannedStudentId: null, studentData: null },
            realtimeResultsListener: null,
        };

        function showToast(message, type = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        function generateRegID() { const r = Math.floor(100000 + Math.random() * 900000); return `RJFSE26-${r}`; }

        function formatDate(date) {
            if (!date) return 'N/A';
            const d = date.toDate ? date.toDate() : new Date(date);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit',
                minute: '2-digit' });
        }

        function escapeHTML(str) { const d = document.createElement('div');
            d.textContent = str; return d.innerHTML; }

        function createParticles() {
            const c = document.getElementById('bgParticles');
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const s = Math.random() * 80 + 20;
                p.style.cssText =
                    `width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*18+10}s;animation-delay:${Math.random()*15}s;`;
                c.appendChild(p);
            }
        }
        createParticles();

        const root = document.getElementById('root');
        const initialLoader = document.getElementById('initialLoader');

        function renderApp() {
            const portal = AppState.currentPortal;
            if (!portal) { renderLandingPage(); return; }
            switch (portal) {
                case 'student-reg':
                    renderStudentRegistration();
                    break;
                case 'student-assist':
                    renderStudentAssistant();
                    break;
                case 'admin-assist':
                    renderAdminAssistant();
                    break;
                case 'admin':
                    renderAdminPortal();
                    break;
                case 'eval-committee':
                    renderEvalCommittee();
                    break;
                default:
                    renderLandingPage();
            }
        }

        function navigateTo(portal) {
            if (AppState.realtimeResultsListener) { AppState.realtimeResultsListener(); AppState
            .realtimeResultsListener = null; }
            AppState.currentPortal = portal;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==================== LANDING PAGE ====================
        function renderLandingPage() {
            AppState.currentPortal = null;
            root.innerHTML = `
            <div class="app-header"><div class="header-logo"><div class="logo-icon">RJF</div><div><div class="header-title">RJF Scholarship Examination 2026</div><div class="header-subtitle">EMPOWERING FUTURE LEADERS</div></div></div></div>
            <div style="text-align:center;padding:30px 0;"><h2 style="color:var(--primary);font-size:1.8rem;">Welcome to RJFSE 2026</h2><p style="color:var(--text-light);margin-bottom:30px;">Select a portal to get started</p></div>
            <div class="card-grid" style="max-width:1000px;margin:0 auto;">
              <div class="card card-accent" style="cursor:pointer;text-align:center;" onclick="navigateTo('student-reg')"><div style="font-size:3rem;">📝</div><div class="card-header" style="justify-content:center;">Student Registration</div><p style="color:var(--text-light);font-size:0.85rem;">Register for the examination</p><button class="btn btn-primary mt-2">Register Now</button></div>
              <div class="card" style="cursor:pointer;text-align:center;border-left:4px solid #0277bd;" onclick="navigateTo('student-assist')"><div style="font-size:3rem;">🔍</div><div class="card-header" style="justify-content:center;">Student Assistant</div><p style="color:var(--text-light);font-size:0.85rem;">Check status, room & seat</p><button class="btn btn-info mt-2">Check Status</button></div>
              <div class="card" style="cursor:pointer;text-align:center;border-left:4px solid #f9a825;" onclick="navigateTo('admin-assist')"><div style="font-size:3rem;">📋</div><div class="card-header" style="justify-content:center;">Admin Assistant</div><p style="color:var(--text-light);font-size:0.85rem;">Answer sheet management</p><button class="btn btn-warning mt-2">Login</button></div>
              <div class="card" style="cursor:pointer;text-align:center;border-left:4px solid #c62828;" onclick="navigateTo('admin')"><div style="font-size:3rem;">⚙️</div><div class="card-header" style="justify-content:center;">Admin Portal</div><p style="color:var(--text-light);font-size:0.85rem;">Full control & results</p><button class="btn btn-danger mt-2">Admin Login</button></div>
              <div class="card" style="cursor:pointer;text-align:center;border-left:4px solid #6a1b9a;" onclick="navigateTo('eval-committee')"><div style="font-size:3rem;">📝</div><div class="card-header" style="justify-content:center;">Evaluation Committee</div><p style="color:var(--text-light);font-size:0.85rem;">Anonymous answer sheet evaluation</p><button class="btn btn-info mt-2" style="background:#6a1b9a;color:#fff;">Enter</button></div>
            </div>
            <div style="text-align:center;padding:20px;color:var(--text-light);font-size:0.8rem;">© 2026 RJF Scholarship Examination</div>`;
        }

        // ==================== STUDENT REGISTRATION (abbreviated for space, full logic retained) ====================
        function renderStudentRegistration() {
            root.innerHTML = `
            <div class="app-header no-print"><div class="header-logo"><div class="logo-icon">RJF</div><div><div class="header-title">Student Registration</div></div></div><div class="header-actions"><button class="btn btn-outline btn-sm" onclick="navigateTo(null)">🏠 Home</button></div></div>

                <button class="btn btn-info btn-sm" onclick="refreshAdminResultsTable()">🔄 Refresh</button>
              </div>
              <div class="table-container"><table id="adminResultsTable"><thead><tr><th>Position</th><th>Name</th><th>Roll</th><th>Answer Sheet ID</th><th>Score</th><th>Comments</th><th>Uploaded</th></tr></thead><tbody id="adminResultsBody"><tr><td colspan="7"><div class="spinner"></div></td></tr></tbody></table></div>
            </div>`;
            attachRealtimeResultsListener();
            refreshAdminResultsTable();
        }

        function attachRealtimeResultsListener() {
            if (AppState.realtimeResultsListener) AppState.realtimeResultsListener();
            const unsubscribe = db.collection('students').where('result.score', '>=', 0).onSnapshot(() => {
                refreshAdminResultsTable();
            }, err => console.error('Realtime listener error:', err));
            AppState.realtimeResultsListener = unsubscribe;
        }

        async function refreshAdminResultsTable() {
            const tbody = document.getElementById('adminResultsBody');
            const sortBy = document.getElementById('adminResultSort')?.value || 'score';
            if (!tbody) return;
            try {
                const snap = await db.collection('students').where('result.score', '>=', 0).get();
                const results = [];
                snap.forEach(d => { const data = d.data(); if (data.result) results.push({ id: d.id, ...data }); });
                results.sort((a, b) => sortBy === 'roll' ? (a.classRoll || '').localeCompare(b.classRoll || '') : (b
                    .result.score || 0) - (a.result.score || 0));
                if (results.length === 0) { tbody.innerHTML =
                        '<tr><td colspan="7" class="text-center">No results uploaded yet.</td></tr>'; return; }
                let html = '';
                results.forEach((r, i) => {
                    const pos = i + 1;
                    let posDisplay = pos;
                    let rowClass = '';
                    if (pos === 1) { posDisplay =
                            '<span class="trophy-icon">🥇</span> 1st';
                        rowClass = 'trophy-gold'; } else if (pos === 2) { posDisplay =
                            '<span class="trophy-icon">🥈</span> 2nd';
                        rowClass = 'trophy-silver'; } else if (pos === 3) { posDisplay =
                            '<span class="trophy-icon">🥉</span> 3rd';
                        rowClass = 'trophy-bronze'; }
                    html +=
                        `<tr class="${rowClass}"><td><strong>${posDisplay}</strong></td><td>${escapeHTML(r.name)}</td><td>${r.classRoll||'N/A'}</td><td>${r.result.answerSheetId||'N/A'}</td><td><strong>${r.result.score}</strong></td><td>${escapeHTML(r.result.comments||'-')}</td><td>${formatDate(r.result.uploadedAt)}</td></tr>`;
                });
                tbody.innerHTML = html;
            } catch (e) { tbody.innerHTML = `<tr><td colspan="7" class="text-center">Error: ${e.message}</td></tr>`; }
        }

        // ==================== EVALUATION COMMITTEE PORTAL ====================
        function renderEvalCommittee() {
            if (!AppState.evalCommitteeAuth) { renderEvalCommitteeLogin(); return; }
            renderEvalCommitteeDashboard();
        }

        function renderEvalCommitteeLogin() {
            root.innerHTML = `
            <div class="app-header no-print"><div class="header-logo"><div class="logo-icon">RJF</div><div><div class="header-title">Evaluation Committee</div><div class="header-subtitle">Anonymous Marking</div></div></div><div class="header-actions"><button class="btn btn-outline btn-sm" onclick="navigateTo(null)">🏠 Home</button></div></div>
            <div class="card" style="max-width:420px;margin:40px auto;"><div class="card-header">🔐 Evaluator Login</div>
              <form onsubmit="handleEvalLogin(event)"><div class="form-group"><label>Email</label><input type="email" id="evalEmail" value="evaluator@rjfse26.com" required></div><div class="form-group"><label>Password</label><input type="password" id="evalPassword" value="Eval@2026" required></div><button type="submit" class="btn w-full" style="background:#6a1b9a;color:#fff;">🔓 Login</button></form><div id="evalLoginError"></div></div>`;
        }

        function handleEvalLogin(e) {
            e.preventDefault();
            if (document.getElementById('evalEmail').value.trim() === 'evaluator@rjfse26.com' && document.getElementById(
                    'evalPassword').value.trim() === 'Eval@2026') {
                AppState.evalCommitteeAuth = { email: 'evaluator@rjfse26.com', role: 'Evaluator' };
                showToast('Evaluator login success!', 'success');
                renderEvalCommitteeDashboard();
            } else { document.getElementById('evalLoginError').innerHTML =
                    '<p style="color:var(--danger);">Invalid credentials.</p>'; }
        }

        function renderEvalCommitteeDashboard() {
            AppState.resultUploadSession = { scannedAnswerSheetId: null, scannedStudentId: null, studentData: null };
            root.innerHTML = `
            <div class="app-header no-print"><div class="header-logo"><div class="logo-icon">RJF</div><div><div class="header-title">Evaluation Committee</div><div class="header-subtitle">Anonymous Marking System</div></div></div><div class="header-actions"><button class="btn btn-outline btn-sm" onclick="logoutEval()">🚪 Logout</button><button class="btn btn-outline btn-sm" onclick="navigateTo(null)">🏠 Home</button></div></div>
            <div class="card">
              <div class="anonymous-badge">🔒 ANONYMOUS MODE - Student identity hidden</div>
              <div class="anonymous-warning"><span style="font-size:1.5rem;">⚠️</span><span><strong>Privacy:</strong> You cannot see the student's name. Only the answer sheet QR is used.</span></div>
              <p style="margin-bottom:16px;">Step 1: Scan the answer sheet QR code.</p>
              <div id="evalStep1"><button class="btn btn-info w-full" onclick="startEvalAnswerSheetScan()">📷 Scan Answer Sheet QR</button>
                <div id="evalAnswerSheetQR" style="max-width:350px;margin:12px auto;"></div>
                <button class="btn btn-ghost btn-sm w-full mt-2" id="stopEvalAnsQR" style="display:none;" onclick="stopEvalAnswerSheetScanner()">⏹️ Stop</button>
                <div id="evalAnswerSheetInfo" style="margin-top:12px;"></div></div>
              <div id="evalStep2" style="display:none;"><hr style="margin:16px 0;"><p>Step 2: Enter score.</p>
                <div class="anonymous-warning">📋 Answer Sheet: <strong id="evalDisplaySheetId"></strong></div>
                <div class="form-group"><label>📊 Score *</label><input type="number" id="evalScore" placeholder="e.g. 85" min="0" max="200" required style="font-size:1.2rem;text-align:center;"></div>
                <div class="form-group"><label>💬 Comments</label><input type="text" id="evalComments" placeholder="Optional remarks"></div>
                <button class="btn btn-success w-full" onclick="uploadEvalResult()">✅ Upload Result</button>
                <div id="evalUploadStatus" style="margin-top:12px;"></div></div>
            </div>`;
        }

        function startEvalAnswerSheetScan() {
            const qrDiv = document.getElementById('evalAnswerSheetQR');
            if (!qrDiv) return;
            qrDiv.innerHTML = '';
            const scanner = new Html5Qrcode('evalAnswerSheetQR');
            window._evalAnsScanner = scanner;
            document.getElementById('stopEvalAnsQR').style.display = 'block';
            document.getElementById('evalAnswerSheetInfo').innerHTML =
                '<p style="color:var(--info);">⏳ Scanning answer sheet QR...</p>';
            scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } },
                async (decodedText) => {
                    stopEvalAnswerSheetScanner();
                    const sheetId = decodedText.trim();
                    document.getElementById('evalAnswerSheetInfo').innerHTML =
                        `<p style="color:var(--success);">✅ Scanned: <strong>${sheetId}</strong></p><p>Searching...</p>`;
                    try {
                        const qSnap = await db.collection('students').where('answerSheetNumber', '==', sheetId)
                            .limit(1).get();
                        if (qSnap.empty) {
                            document.getElementById('evalAnswerSheetInfo').innerHTML +=
                                '<p style="color:var(--danger);">❌ No student found.</p>';
                            AppState.resultUploadSession = { scannedAnswerSheetId: null,
                            scannedStudentId: null, studentData: null };
                            return;
                        }
                        const doc = qSnap.docs[0];
                        AppState.resultUploadSession = { scannedAnswerSheetId: sheetId, scannedStudentId: doc.id,
                            studentData: doc.data() };
                        document.getElementById('evalDisplaySheetId').textContent = sheetId;
                        document.getElementById('evalStep2').style.display = 'block';
                        document.getElementById('evalScore').value = '';
                        document.getElementById('evalComments').value = '';
                        document.getElementById('evalUploadStatus').innerHTML = '';
                    } catch (e) {
                        document.getElementById('evalAnswerSheetInfo').innerHTML +=
                            `<p style="color:var(--danger);">Error: ${e.message}</p>`;
                    }
                }, () => {}).catch(() => { showToast('Camera error', 'error');
                document.getElementById('stopEvalAnsQR').style.display = 'none'; });
        }

        function stopEvalAnswerSheetScanner() {
            if (window._evalAnsScanner) { window._evalAnsScanner.stop().catch(() => {}); window._evalAnsScanner = null; }
            document.getElementById('stopEvalAnsQR') && (document.getElementById('stopEvalAnsQR').style.display = 'none');
        }

        async function uploadEvalResult() {
            const session = AppState.resultUploadSession;
            if (!session || !session.scannedStudentId) { showToast('Scan answer sheet first.', 'error'); return; }
            const score = parseFloat(document.getElementById('evalScore').value);
            if (isNaN(score) || score < 0) { showToast('Enter valid score.', 'error'); return; }
            const statusDiv = document.getElementById('evalUploadStatus');
            statusDiv.innerHTML = '<div class="spinner"></div><p>Uploading...</p>';
            const resultData = { score, comments: document.getElementById('evalComments').value.trim() || '',
                answerSheetId: session.scannedAnswerSheetId, uploadedAt: firebase.firestore.FieldValue
                .serverTimestamp(), uploadedBy: 'Evaluation Committee' };
            try {
                await db.collection('students').doc(session.scannedStudentId).update({ result: resultData,
                    status: 'Result Published' });
                await rtdb.ref('students/' + session.scannedStudentId + '/result').set({ ...resultData,
                    uploadedAt: Date.now() });
                await rtdb.ref('students/' + session.scannedStudentId).update({ status: 'Result Published' });
                statusDiv.innerHTML =
                    '<div style="background:#e8f5e9;padding:16px;border-radius:10px;text-align:center;"><h4>✅ Uploaded!</h4><p>Score: <strong>' +
                    score + '</strong></p></div>';
                showToast('Result uploaded!', 'success');
                setTimeout(() => { renderEvalCommitteeDashboard(); }, 2000);
            } catch (e) { statusDiv.innerHTML = `<p style="color:var(--danger);">Error: ${e.message}</p>`; }
        }

        function logoutEval() { AppState.evalCommitteeAuth = null;
            stopEvalAnswerSheetScanner();
            renderApp();
            showToast('Logged out.', ''); }

        // ==================== SHARED MODALS & ACTIONS ====================
        async function openStudentDetailModal(rid) { try { const d = await db.collection('students').doc(rid).get(); if (!d
                    .exists) return;
                const s = d.data();
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.onclick = e => { if (e.target === modal) modal.remove(); };
                modal.innerHTML =
                    `<div class="modal"><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button><h3>${escapeHTML(s.name)}</h3><p>ID: ${rid} | Class: ${s.class} | Room: ${s.examRoomNumber||'N/A'} | Sit: ${s.sitNumber||'N/A'}</p><div class="form-row"><div class="form-group"><label>Room</label><input type="text" id="editRoom" value="${s.examRoomNumber||''}"></div><div class="form-group"><label>Sit</label><input type="text" id="editSit" value="${s.sitNumber||''}"></div></div><button class="btn btn-primary w-full" onclick="updateStudentDetail('${rid}')">💾 Save</button></div>`;
                document.body.appendChild(modal); } catch (e) { showToast('Error', 'error'); } }

        async function updateStudentDetail(rid) { const room = document.getElementById('editRoom').value.trim(),
                sit = document.getElementById('editSit').value.trim(); try { await db.collection('students').doc(rid)
                    .update({ examRoomNumber: room, sitNumber: sit });
                await rtdb.ref('students/' + rid).update({ examRoomNumber: room, sitNumber: sit });
                showToast('Updated!', 'success');
                document.querySelector('.modal-overlay')?.remove();
                await loadAdminStats();
                switchAdminTab('students', document.querySelector('.tab-btn')); } catch (e) { showToast('Error', 'error'); } }

        function openAddAssistantModal() { const m = document.createElement('div');
            m.className = 'modal-overlay';
            m.onclick = e => { if (e.target === m) m.remove(); };
            m.innerHTML =
                `<div class="modal"><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button><h3>➕ Add Assistant</h3><form onsubmit="handleAddAssistant(event)"><div class="form-group"><label>Name</label><input type="text" id="asstName" required></div><div class="form-group"><label>Mobile</label><input type="tel" id="asstMobile" required></div><button type="submit" class="btn btn-primary w-full">💾 Save</button></form></div>`;
            document.body.appendChild(m); }

        async function handleAddAssistant(e) { e.preventDefault(); try { await db.collection('adminAssistants').add({
                    name: document.getElementById('asstName').value.trim(),
                    mobile: document.getElementById('asstMobile').value.trim(), createdAt: firebase.firestore
                        .FieldValue.serverTimestamp() });
                showToast('Added!', 'success');
                document.querySelector('.modal-overlay')?.remove();
                await loadAdminStats();
                switchAdminTab('assistants', document.querySelector('.tab-btn')); } catch (err) { showToast('Error',
                'error'); } }

        function openAddVolunteerModal() { const m = document.createElement('div');
            m.className = 'modal-overlay';
            m.onclick = e => { if (e.target === m) m.remove(); };
            m.innerHTML =
                `<div class="modal"><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button><h3>🙋 Add Volunteer</h3><form onsubmit="handleAddVolunteer(event)"><div class="form-group"><label>Name</label><input type="text" id="volName" required></div><div class="form-group"><label>Mobile</label><input type="tel" id="volMobile" required></div><button type="submit" class="btn btn-primary w-full">💾 Save</button></form></div>`;
            document.body.appendChild(m); }

        async function handleAddVolunteer(e) { e.preventDefault(); try { await db.collection('volunteers').add({
                    name: document.getElementById('volName').value.trim(),
                    mobile: document.getElementById('volMobile').value.trim(), createdAt: firebase.firestore
                        .FieldValue.serverTimestamp() });
                showToast('Added!', 'success');
                document.querySelector('.modal-overlay')?.remove();
                await loadAdminStats();
                switchAdminTab('volunteers', document.querySelector('.tab-btn')); } catch (err) { showToast('Error',
                'error'); } }

        async function generatePDFReport(type) { const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const students = AppState.allStudents || [];
            let f = [],
                t = ''; if (type === 'all') { f = students;
                t = 'All Students'; } else if (type === 'completed') { f = students.filter(s => s.status === 'Completed');
                t = 'Completed'; }
            doc.text('RJFSE 2026 - ' + t, 14, 20);
            doc.autoTable({ startY: 28, head: [
                    ['#', 'ID', 'Name', 'Class', 'Status']
                ], body: f.map((s, i) => [i + 1, s.id || s.registrationID, s.name, s.class, s.status]) });
            doc.save(`report_${type}.pdf`);
            showToast('PDF downloaded!', 'success'); }

        function logoutAdmin() { AppState.adminAuth = null; if (AppState.realtimeResultsListener) { AppState
                .realtimeResultsListener();
                AppState.realtimeResultsListener = null; }
            renderApp(); }

        window.loadAAAssignedStudents = loadAAAssignedStudents;
        window.handleAdminLogin = handleAdminLogin;
        window.logoutAdmin = logoutAdmin;

        window.openStudentDetailModal = openStudentDetailModal;

        window.openAddAssistantModal = openAddAssistantModal;

        window.stopEvalAnswerSheetScanner = stopEvalAnswerSheetScanner;

        function initApp() { if (initialLoader) initialLoader.style.display = 'none';
            renderLandingPage(); }
        document.addEventListener('DOMContentLoaded', initApp);
        if (document.readyState !== 'loading') initApp();
