<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJF Scholarship Examination 2026</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js">
    </script>

    <!-- QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>

    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js">
    </script>

    <!-- html2canvas for admit card -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>

    <style>
        :root {
            --primary: #1a237e;
            --primary-light: #283593;
            --accent: #ff6d00;
            --accent-light: #ff9100;
            --success: #2e7d32;
            --warning: #f9a825;
            --danger: #c62828;
            --info: #0277bd;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #212121;
            --text-light: #616161;
            --border: #e0e0e0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #e8eaf6 0%, #f5f6fa 30%, #e3f2fd 60%, #fce4ec 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.06;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.06;
            }
            90% {
                opacity: 0.06;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        /* Main container */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Header */
        .app-header {
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1a237e 100%);
            color: #fff;
            border-radius: var(--radius);
            padding: 20px 28px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            animation: slideDown 0.6s ease-out;
        }
        @keyframes slideDown {
            from {
                transform: translateY(-40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .app-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .app-header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: 10%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 109, 0, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 1;
        }
        .header-logo .logo-icon {
            width: 52px;
            height: 52px;
            background: var(--accent);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(255, 109, 0, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 6px 20px rgba(255, 109, 0, 0.4);
            }
            50% {
                box-shadow: 0 6px 35px rgba(255, 109, 0, 0.7);
            }
        }
        .header-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }
        .header-subtitle {
            font-size: 0.8rem;
            opacity: 0.85;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            z-index: 1;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(255, 109, 0, 0.35);
        }
        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 109, 0, 0.45);
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
            transform: translateY(-2px);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 20px;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-info {
            background: var(--info);
            color: #fff;
        }
        .btn-warning {
            background: var(--warning);
            color: #212121;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-ghost:hover {
            background: #f5f5f5;
            border-color: #bdbdbd;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid transparent;
            animation: fadeInUp 0.5s ease-out forwards;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
            border-color: #e8eaf6;
            transform: translateY(-2px);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card-accent {
            border-left: 4px solid var(--accent);
        }
        .card-header {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }
        .stat-card {
            text-align: center;
            padding: 20px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, #f8f9ff 0%, #fff 100%);
            cursor: default;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #3949ab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text);
            letter-spacing: 0.2px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 15px;
            border: 2px solid var(--border);
            border-radius: 25px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: #fafafa;
            font-family: var(--font);
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.08);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .card-grid {
                grid-template-columns: 1fr;
            }
            .app-header {
                flex-direction: column;
                text-align: center;
            }
            .header-logo {
                flex-direction: column;
            }
            .btn {
                padding: 8px 15px;
                font-size: 0.8rem;
            }
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        table th,
        table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        table th {
            background: #f8f9ff;
            font-weight: 700;
            color: var(--primary);
            position: sticky;
            top: 0;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        table tbody tr {
            transition: var(--transition);
        }
        table tbody tr:hover {
            background: #fafbff;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            padding: 28px;
            max-width: 600px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalPop 0.3s ease;
        }
        @keyframes modalPop {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
        }
        .modal-close:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .badge-warning {
            background: #fff8e1;
            color: #f57f17;
        }
        .badge-info {
            background: #e1f5fe;
            color: #0277bd;
        }
        .badge-danger {
            background: #ffebee;
            color: #c62828;
        }
        .badge-primary {
            background: #e8eaf6;
            color: #1a237e;
        }

        /* QR Scanner */
        #qr-reader,
        [id^="qr-reader"] {
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 2px solid var(--border);
            max-width: 400px;
            margin: 0 auto;
        }
        #qr-reader__dashboard_section_csr button,
        [id^="qr-reader"] button {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #212121;
            color: #fff;
            padding: 14px 22px;
            border-radius: 25px;
            font-weight: 600;
            z-index: 2000;
            animation: slideInRight 0.4s ease, fadeOutRight 0.4s ease 2.6s forwards;
            box-shadow: var(--shadow-lg);
            font-size: 0.9rem;
        }
        .toast-success {
            background: #2e7d32;
        }
        .toast-error {
            background: #c62828;
        }
        @keyframes slideInRight {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes fadeOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 4px;
        }
        .tab-btn {
            padding: 9px 18px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            border-radius: 20px 20px 0 0;
            transition: var(--transition);
            font-size: 0.85rem;
            color: var(--text-light);
            position: relative;
        }
        .tab-btn.active {
            color: var(--primary);
            background: #e8eaf6;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            border-radius: 3px;
        }
        .tab-btn:hover {
            color: var(--primary);
            background: #f5f5ff;
        }

        /* Loading spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Highlight animation */
        .highlight-row {
            animation: highlightAnim 1.5s ease;
        }
        @keyframes highlightAnim {
            0%,
            100% {
                background: transparent;
            }
            50% {
                background: #fff9c4;
            }
        }

        /* Anonymous result area */
        .anonymous-badge {
            background: #1a237e;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .anonymous-warning {
            background: #fff3e0;
            border-left: 4px solid #ff6d00;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #e65100;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Print styles */
        @media print {
            body {
                background: #fff;
            }
            .no-print {
                display: none !important;
            }
            .card {
                box-shadow: none;
                border: 2px solid #000;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f5f5f5;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c5c5c5;
            border-radius: 3px;
        }

        .text-center {
            text-align: center;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .mt-3 {
            margin-top: 18px;
        }
        .mb-2 {
            margin-bottom: 12px;
        }
        .mb-3 {
            margin-bottom: 18px;
        }
        .gap-2 {
            gap: 10px;
        }
        .flex-wrap {
            display: flex;
            flex-wrap: wrap;
        }
        .w-full {
            width: 100%;
        }

        /* Skeleton loading */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
    </style>
</head>
<body>

    <!-- Background Particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- App Container -->
    <div id="root" class="app-container">
        <div class="spinner" id="initialLoader"></div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBB4caiGCLBbTulWTwV1p5pgjyU_SKjTxI",
            authDomain: "rjfse2026.firebaseapp.com",
            databaseURL: "https://rjfse2026-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rjfse2026",
            storageBucket: "rjfse2026.firebasestorage.app",
            messagingSenderId: "39296282344",
            appId: "1:39296282344:web:6764b39a64e5492a9e235d",
            measurementId: "G-HG228HY13Z"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const rtdb = firebase.database();
        const storage = firebase.storage();

        // ==================== GLOBAL STATE ====================
        const AppState = {
            currentPortal: null,
            adminAuth: null,
            adminAssistAuth: null,
            currentUser: null,
            assignedStudents: [],
            allStudents: [],
            allAssistants: [],
            allVolunteers: [],
            stats: null,
            // For anonymous result upload
            resultUploadSession: {
                scannedAnswerSheetId: null,
                scannedStudentId: null,
                studentData: null,
            }
        };

        // ==================== UTILITY FUNCTIONS ====================
        function showToast(message, type = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        function generateRegID() {
            const random = Math.floor(100000 + Math.random() * 900000);
            return `RJFSE26-${random}`;
        }

        function formatDate(date) {
            if (!date) return 'N/A';
            const d = date.toDate ? date.toDate() : new Date(date);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit',
                minute: '2-digit' });
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== BACKGROUND PARTICLES ====================
        function createParticles() {
            const container = document.getElementById('bgParticles');
            for (let i = 0; i < 35; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 80 + 20;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 18 + 10 + 's';
                particle.style.animationDelay = Math.random() * 15 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // ==================== MAIN APP RENDERER ====================
        const root = document.getElementById('root');
        const initialLoader = document.getElementById('initialLoader');

        function renderApp() {
            const portal = AppState.currentPortal;
            if (!portal) {
                renderLandingPage();
                return;
            }
            switch (portal) {
                case 'student-reg':
                    renderStudentRegistration();
                    break;
                case 'student-assist':
                    renderStudentAssistant();
                    break;
                case 'admin-assist':
                    renderAdminAssistant();
                    break;
                case 'admin':
                    renderAdminPortal();
                    break;
                default:
                    renderLandingPage();
            }
        }

        // ==================== LANDING PAGE ====================
        function renderLandingPage() {
            AppState.currentPortal = null;
            root.innerHTML = `
            <div class="app-header">
              <div class="header-logo">
                <div class="logo-icon">RJF</div>
                <div>
                  <div class="header-title">RJF Scholarship Examination 2026</div>
                  <div class="header-subtitle">EMPOWERING FUTURE LEADERS</div>
                </div>
              </div>
            </div>
            <div style="text-align:center;padding:30px 0;">
              <h2 style="color:var(--primary);font-size:1.8rem;margin-bottom:8px;">Welcome to RJFSE 2026</h2>
              <p style="color:var(--text-light);font-size:1rem;margin-bottom:30px;">Select a portal to get started</p>
            </div>
            <div class="card-grid" style="max-width:900px;margin:0 auto;">

        function handleClassChange() {
            const classSelect = document.getElementById('regClass');
            const groupSelect = document.getElementById('regGroup');
            if (!classSelect || !groupSelect) return;
            const cls = classSelect.value;
            groupSelect.innerHTML = '<option value="">Select Group</option>';
            if (cls === '8') {
                groupSelect.innerHTML = '<option value="Junior" selected>Junior</option>';
                groupSelect.disabled = true;
            } else if (cls === '9' || cls === '10') {
                ['Science', 'Arts', 'Commerce', 'Vocational'].forEach(g => groupSelect.innerHTML +=
                    `<option value="${g}">${g}</option>`);
                groupSelect.disabled = false;
            } else {
                ['Junior', 'Science', 'Arts', 'Commerce', 'Vocational'].forEach(g => groupSelect.innerHTML +=
                    `<option value="${g}">${g}</option>`);
                groupSelect.disabled = false;
            }
        }

        async function handleStudentRegistration(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('regSubmitBtn') || event.target.querySelector('button[type="submit"]');
            if (submitBtn) { submitBtn.disabled = true;
                submitBtn.textContent = '⏳ Registering...'; }
            const regID = generateRegID();
            const studentData = {
                registrationID: regID,
                name: document.getElementById('regName').value.trim(),
                fatherName: document.getElementById('regFather').value.trim(),
                motherName: document.getElementById('regMother').value.trim(),
                classRoll: document.getElementById('regRoll').value.trim(),
                class: document.getElementById('regClass').value,
                group: document.getElementById('regGroup').value,
                gender: document.getElementById('regGender').value,
                mobile: document.getElementById('regMobile').value.trim(),
                examRoomNumber: '',
                sitNumber: '',
                status: 'Registered',
                answerSheetAttached: false,
                answerSheetNumber: '',
                checkedIn: false,
                present: false,
                result: null,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            };
            try {
                const existingQuery = await db.collection('students').where('mobile', '==', studentData.mobile).get();
                if (!existingQuery.empty) throw new Error('Mobile number already registered.');
                const picFile = document.getElementById('regPicture').files[0];
                if (picFile) {
                    const picRef = storage.ref(`student_pictures/${regID}_${picFile.name}`);
                    await picRef.put(picFile);
                    studentData.pictureURL = await picRef.getDownloadURL();
                } else studentData.pictureURL = '';
                await db.collection('students').doc(regID).set(studentData);
                await rtdb.ref('students/' + regID).set({ ...studentData, createdAt: Date.now() });
                const resultDiv = document.getElementById('regResult');
                resultDiv.innerHTML = `
              <div style="background:#e8f5e9;padding:20px;border-radius:12px;text-align:center;animation:fadeInUp 0.5s ease;">
                <div style="font-size:3rem;">✅</div><h3 style="color:#2e7d32;">Registration Successful!</h3>
                <p style="font-size:1.2rem;font-weight:700;">Your ID:</p><p style="font-size:2rem;font-weight:900;color:var(--accent);">${regID}</p>
                <button class="btn btn-primary mt-2" onclick="window.print()">🖨️ Print</button>
              </div>`;
                document.getElementById('studentRegForm').reset();
                document.getElementById('regPreview').innerHTML = '';
                handleClassChange();
                showToast('Registered! ID: ' + regID, 'success');
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                alert('Registration failed: ' + e.message);
            } finally {
                if (submitBtn) { submitBtn.disabled = false;
                    submitBtn.textContent = '📋 Register Now'; }
            }
        }

        async function loadAAAssignedStudents() {
            const div = document.getElementById('aaAssignedList');
            if (!div) return;
            div.innerHTML = '<div class="spinner"></div>';
            try {
                const snap = await db.collection('students').orderBy('createdAt', 'desc').limit(50).get();
                const list = [];
                snap.forEach(d => list.push({ id: d.id, ...d.data() }));
                list.sort((a, b) => (a.classRoll || '').localeCompare(b.classRoll || ''));
                let html =
                    `<div class="table-container"><table><thead><tr><th>#</th><th>ID</th><th>Name</th><th>Class</th><th>Room</th><th>Sit</th><th>Present</th><th>Sheet</th></tr></thead><tbody>`;

                        `<tr style="cursor:pointer;" onclick="document.getElementById('aaSearchInput').value='${s.id}';searchAAStudent();"><td>${i+1}</td><td>${s.id}</td><td>${escapeHTML(s.name)}</td><td>${s.class}</td><td>${s.examRoomNumber||'-'}</td><td>${s.sitNumber||'-'}</td><td><span class="badge ${s.present?'badge-success':'badge-danger'}">${s.present?'Yes':'No'}</span></td><td><span class="badge ${s.answerSheetAttached?'badge-success':'badge-warning'}">${s.answerSheetAttached?'Yes':'No'}</span></td></tr>`; });
                html += '</tbody></table></div>';
                div.innerHTML = html;
            } catch (e) { div.innerHTML = `<p style="color:var(--danger);">Error: ${e.message}</p>`; }
        }

        async function loadAdminDashboardStats() {
            try {
                const snap = await db.collection('students').get();

                snap.forEach(d => students.push({ id: d.id, ...d.data() }));
                const asstSnap = await db.collection('adminAssistants').get();

                const volSnap = await db.collection('volunteers').get();
                const volunteers = [];
                volSnap.forEach(d => volunteers.push({ id: d.id, ...d.data() }));
                AppState.allStudents = students;
                AppState.allAssistants = assistants;
                AppState.allVolunteers = volunteers;
                AppState.stats = {
                    total: students.length,
                    class8: students.filter(s => s.class === '8').length,
                    class9: students.filter(s => s.class === '9').length,
                    class10: students.filter(s => s.class === '10').length,
                    present: students.filter(s => s.present).length,
                    present8: students.filter(s => s.class === '8' && s.present).length,
                    present9: students.filter(s => s.class === '9' && s.present).length,
                    present10: students.filter(s => s.class === '10' && s.present).length,
                    absent: students.filter(s => !s.present).length,
                    completed: students.filter(s => s.status === 'Completed').length,
                    withResult: students.filter(s => s.result && s.result.score !== undefined).length,
                    totalAssistants: assistants.length,
                    totalVolunteers: volunteers.length,
                };
            } catch (e) { AppState.stats = { total: 0, class8: 0, class9: 0, class10: 0, present: 0, present8: 0,
                    present9: 0, present10: 0, absent: 0, completed: 0, withResult: 0, totalAssistants: 0,
                    totalVolunteers: 0 }; }
        }

        function startResultAnswerSheetScan() {
            const qrDiv = document.getElementById('resultAnswerSheetQR');
            if (!qrDiv) return;
            qrDiv.innerHTML = '';
            const scanner = new Html5Qrcode('resultAnswerSheetQR');
            window._resultAnsScanner = scanner;
            document.getElementById('stopResultAnsQR').style.display = 'block';
            document.getElementById('resultAnswerSheetInfo').innerHTML =
                '<p style="color:var(--info);">⏳ Scanning... Point camera at answer sheet QR code.</p>';

            scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } },
                async (decodedText) => {
                    // Scanned answer sheet QR
                    stopResultAnswerSheetScanner();
                    const sheetId = decodedText.trim();
                    document.getElementById('resultAnswerSheetInfo').innerHTML =
                        `<p style="color:var(--success);">✅ Answer Sheet Scanned: <strong>${sheetId}</strong></p><p style="color:var(--text-light);">Searching for matching student...</p>`;

                    // Find student by answerSheetNumber
                    try {
                        const qSnap = await db.collection('students').where('answerSheetNumber', '==', sheetId)
                            .limit(1).get();
                        if (qSnap.empty) {
                            document.getElementById('resultAnswerSheetInfo').innerHTML +=
                                '<p style="color:var(--danger);">❌ No student found with this answer sheet ID. Please check and try again.</p>';
                            AppState.resultUploadSession = { scannedAnswerSheetId: null,
                                scannedStudentId: null, studentData: null };
                            document.getElementById('resultUploadStep2').style.display = 'none';
                            return;
                        }
                        const doc = qSnap.docs[0];
                        const studentData = doc.data();
                        const studentId = doc.id;

                        // Store in session (but DO NOT display name)
                        AppState.resultUploadSession = {
                            scannedAnswerSheetId: sheetId,
                            scannedStudentId: studentId,
                            studentData: studentData,
                        };

                        // Show Step 2 (anonymous - only show sheet ID)
                        document.getElementById('resultDisplaySheetId').textContent = sheetId;
                        document.getElementById('resultUploadStep2').style.display = 'block';
                        document.getElementById('resultScore').value = '';
                        document.getElementById('resultComments').value = '';
                        document.getElementById('resultUploadStatus').innerHTML = '';
                        document.getElementById('resultAnswerSheetInfo').innerHTML +=
                            '<p style="color:var(--success);">✅ Student matched. Proceed to enter score below.</p>';
                    } catch (e) {
                        document.getElementById('resultAnswerSheetInfo').innerHTML +=
                            `<p style="color:var(--danger);">Error: ${e.message}</p>`;
                    }
                },
                () => {}
            ).catch(() => {
                showToast('Camera access denied', 'error');
                document.getElementById('stopResultAnsQR').style.display = 'none';
                document.getElementById('resultAnswerSheetInfo').innerHTML =
                    '<p style="color:var(--danger);">Camera error. Please try again.</p>';
            });
        }

        function stopResultAnswerSheetScanner() {
            if (window._resultAnsScanner) {
                window._resultAnsScanner.stop().catch(() => {});
                window._resultAnsScanner = null;
            }
            const btn = document.getElementById('stopResultAnsQR');
            if (btn) btn.style.display = 'none';
        }

        function resetResultUpload() {
            stopResultAnswerSheetScanner();
            AppState.resultUploadSession = { scannedAnswerSheetId: null, scannedStudentId: null, studentData: null };
            document.getElementById('resultUploadStep2').style.display = 'none';
            document.getElementById('resultAnswerSheetInfo').innerHTML = '';
            document.getElementById('resultAnswerSheetQR').innerHTML = '';
            document.getElementById('resultUploadStatus').innerHTML = '';
            document.getElementById('stopResultAnsQR').style.display = 'none';
            document.getElementById('resultScore') && (document.getElementById('resultScore').value = '');
            document.getElementById('resultComments') && (document.getElementById('resultComments').value = '');
        }

        async function uploadAnonymousResult() {
            const session = AppState.resultUploadSession;
            if (!session || !session.scannedStudentId) {
                showToast('Please scan an answer sheet first.', 'error');
                return;
            }
            const scoreInput = document.getElementById('resultScore');
            const commentsInput = document.getElementById('resultComments');
            const score = parseFloat(scoreInput?.value);
            if (isNaN(score) || score < 0) {
                showToast('Please enter a valid score.', 'error');
                return;
            }
            const statusDiv = document.getElementById('resultUploadStatus');
            statusDiv.innerHTML = '<div class="spinner"></div><p>Uploading result...</p>';

            const resultData = {
                score: score,
                comments: commentsInput?.value?.trim() || '',
                answerSheetId: session.scannedAnswerSheetId,
                uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
                uploadedBy: 'Anonymous Evaluator',
            };

            try {
                // Update Firestore
                await db.collection('students').doc(session.scannedStudentId).update({
                    result: resultData,
                    status: 'Result Published',
                });
                // Update Realtime DB
                await rtdb.ref('students/' + session.scannedStudentId + '/result').set({
                    ...resultData,
                    uploadedAt: Date.now(),
                });
                await rtdb.ref('students/' + session.scannedStudentId).update({ status: 'Result Published' });

                statusDiv.innerHTML = `
              <div style="background:#e8f5e9;padding:16px;border-radius:10px;text-align:center;">
                <div style="font-size:2rem;">✅</div>
                <h4 style="color:#2e7d32;">Result Uploaded Successfully!</h4>
                <p>Answer Sheet: <strong>${session.scannedAnswerSheetId}</strong></p>
                <p>Score: <strong>${score}</strong></p>
                <p style="color:var(--text-light);font-size:0.8rem;">Student identity remains anonymous.</p>
              </div>`;
                showToast('Result uploaded anonymously! ✅', 'success');

                // Reset for next upload
                setTimeout(() => {
                    resetResultUpload();
                    loadRecentResults();
                    loadAdminDashboardStats();
                }, 2000);
            } catch (e) {
                statusDiv.innerHTML = `<p style="color:var(--danger);">Error: ${e.message}</p>`;
                showToast('Upload failed: ' + e.message, 'error');
            }
        }

        async function loadRecentResults() {
            const div = document.getElementById('recentResultsList');
            if (!div) return;
            try {
                const snap = await db.collection('students').where('result.score', '>=', 0).orderBy('result.score',
                    'desc').limit(10).get();
                const results = [];
                snap.forEach(d => {
                    const data = d.data();
                    if (data.result) results.push({ id: d.id, ...data });
                });
                if (results.length === 0) {
                    div.innerHTML = '<p style="color:var(--text-light);text-align:center;">No results uploaded yet.</p>';
                    return;
                }
                let html =
                    `<div class="table-container"><table><thead><tr><th>#</th><th>Answer Sheet ID</th><th>Score</th><th>Comments</th><th>Uploaded</th></tr></thead><tbody>`;
                results.forEach((r, i) => {
                    html +=
                        `<tr><td>${i+1}</td><td>${r.result.answerSheetId||'N/A'}</td><td><strong>${r.result.score}</strong></td><td>${escapeHTML(r.result.comments||'-')}</td><td>${formatDate(r.result.uploadedAt)}</td></tr>`;
                });
                html += '</tbody></table></div>';
                div.innerHTML = html;
            } catch (e) { div.innerHTML = `<p style="color:var(--danger);">Error: ${e.message}</p>`; }
        }

        async function generatePDFReport(type) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const students = AppState.allStudents || [];
            let filtered = [],
                title = '';
            switch (type) {
                case 'all':
                    filtered = students;
                    title = 'All Students';
                    break;
                case 'present':
                    filtered = students.filter(s => s.present);
                    title = 'Present';
                    break;
                case 'absent':
                    filtered = students.filter(s => !s.present);
                    title = 'Absent';
                    break;
                case 'completed':
                    filtered = students.filter(s => s.status === 'Completed');
                    title = 'Completed';
                    break;
                case 'class8':
                    filtered = students.filter(s => s.class === '8');
                    title = 'Class 8';
                    break;
                case 'class9':
                    filtered = students.filter(s => s.class === '9');
                    title = 'Class 9';
                    break;
                case 'class10':
                    filtered = students.filter(s => s.class === '10');
                    title = 'Class 10';
                    break;
            }
            doc.setFontSize(16);
            doc.setTextColor(26, 35, 126);
            doc.text('RJFSE 2026 Report', 14, 20);
            doc.setFontSize(12);
            doc.setTextColor(97, 97, 97);
            doc.text(`${title} (${filtered.length})`, 14, 30);
            doc.autoTable({
                startY: 38,
                head: [
                    ['#', 'ID', 'Name', 'Class', 'Group', 'Room', 'Sit', 'Present', 'Status']
                ],
                body: filtered.map((s, i) => [i + 1, s.id || s.registrationID, s.name, s.class, s.group, s
                    .examRoomNumber || '-', s.sitNumber || '-', s.present ? 'Yes' : 'No', s.status || 'Registered'
                ]),
                styles: { fontSize: 7, cellPadding: 2 },
                headStyles: { fillColor: [26, 35, 126], textColor: 255 },
            });
            doc.save(`RJFSE26_${type}_report.pdf`);
            showToast('PDF downloaded!', 'success');
        }

        function filterStudentTable() {
            const search = (document.getElementById('studentSearch')?.value || '').toLowerCase();
            const cls = document.getElementById('studentClassFilter')?.value || 'all';
            const table = document.getElementById('studentTable');
            if (!table) return;
            table.querySelectorAll('tbody tr').forEach(row => {
                const text = row.textContent.toLowerCase();
                const rowClass = row.cells[3]?.textContent || '';
                row.style.display = (!search || text.includes(search)) && (cls === 'all' || rowClass === cls) ?
                    '' : 'none';
            });
        }

        function logoutAdmin() {
            AppState.adminAuth = null;
            AppState.stats = null;
            AppState.allStudents = [];
            stopResultAnswerSheetScanner();
            renderApp();
            showToast('Admin logged out.', '');
        }
