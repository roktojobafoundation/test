            --accent: #ff6d00;
            --accent-light: #ff9100;
            --success: #2e7d32;
            --warning: #f9a825;
            --danger: #c62828;
            --info: #0277bd;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #212121;
            --text-light: #616161;
            --border: #e0e0e0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            padding: 0;
            box-sizing: border-box;

            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.06;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 0.06;
            }

            90% {
                opacity: 0.06;
            }

            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
        }

        .app-header {
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1a237e 100%);

            border-radius: var(--radius);
            padding: 20px 28px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            animation: slideDown 0.6s ease-out;

        @keyframes slideDown {
            from {
                transform: translateY(-40px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

                box-shadow: 0 6px 20px rgba(255, 109, 0, 0.4);
            }

            50% {
                box-shadow: 0 6px 35px rgba(255, 109, 0, 0.7);
            }

        .header-title {

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

            background: #fff;
            border-radius: var(--radius);
            padding: 28px;

            width: 95%;

        }

            color: var(--primary);

            bottom: -6px;
            left: 0;

            background: var(--accent);

        function formatRegistrationTime(timestamp) {
            if (!timestamp) return 'N/A';
            try {
                if (typeof timestamp === 'object' && timestamp !== null && 'seconds' in timestamp) {
                    return new Date(timestamp.seconds * 1000).toLocaleString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                }
                if (typeof timestamp === 'number') return new Date(timestamp).toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                if (typeof timestamp === 'string') {
                    const d = new Date(timestamp);
                    if (!isNaN(d.getTime())) return d.toLocaleString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    return timestamp;
                }
                if (timestamp instanceof Date) return timestamp.toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                const d = new Date(timestamp);
                if (!isNaN(d.getTime())) return d.toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                return 'N/A';
            } catch (_) { return 'N/A'; }
        }

        function formatDate(date) {
            if (!date) return 'N/A';
            try {
                const d = date.toDate ? date.toDate() : new Date(date);
                return d.toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (_) { return 'N/A'; }
        }

        function processImageURL(url) {
            if (!url || typeof url !== 'string') return url;
            let processed = url.trim();
            const driveFileMatch = processed.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/i);
            if (driveFileMatch) return `https://drive.google.com/uc?export=view&id=${driveFileMatch[1]}`;
            const driveOpenMatch = processed.match(/drive\.google\.com\/open\?id=([^&]+)/i);
            if (driveOpenMatch) return `https://drive.google.com/uc?export=view&id=${driveOpenMatch[1]}`;
            const driveThumbMatch = processed.match(/drive\.google\.com\/thumbnail\?id=([^&]+)/i);
            if (driveThumbMatch) return `https://drive.google.com/uc?export=view&id=${driveThumbMatch[1]}`;
            if (processed.includes('dropbox.com') && processed.includes('?dl=0')) processed = processed.replace('?dl=0',
                '?raw=1');
            if (processed.includes('ibb.co')) {
                const match = processed.match(/ibb\.co\/([a-zA-Z0-9]+)(\/.*)?/);
                if (match) processed = match[2] && /\.[a-zA-Z]+$/.test(match[2]) ?
                    `https://i.ibb.co/${match[1]}${match[2]}` : `https://i.ibb.co/${match[1]}.jpg`;
            }
            const imgurMatch = processed.match(/imgur\.com\/([a-zA-Z0-9]+)(\.[a-zA-Z]+)?/);
            if (imgurMatch) processed = `https://i.imgur.com/${imgurMatch[1]}.jpg`;
            return processed;
        }

        function showToast(message, type = '') {

            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function corsSafeImageURL(originalURL) {
            if (!originalURL || typeof originalURL !== 'string') return originalURL;
            if (originalURL.includes('corsproxy.io') || originalURL.includes('wsrv.nl') || originalURL.startsWith('data:'))
                return originalURL;
            return 'https://corsproxy.io/?' + encodeURIComponent(originalURL.trim());
        }

        async function fetchImageBytesForPDF(photoUrl) {
            if (!photoUrl) return null;
            const urlsToTry = [
                { url: corsSafeImageURL(photoUrl), label: 'corsproxy' },
                { url: `https://wsrv.nl/?url=${encodeURIComponent(photoUrl)}&output=png`, label: 'wsrv' },
                { url: photoUrl, label: 'direct' }
            ];
            for (const attempt of urlsToTry) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 12000);
                    const res = await fetch(attempt.url, { signal: controller.signal, mode: 'cors' });
                    clearTimeout(timeoutId);
                    if (res.ok) {
                        const bytes = await res.arrayBuffer();
                        const contentType = res.headers.get('content-type') || '';
                        return { bytes, contentType };
                    }
                } catch (_) { continue; }
            }
            return null;
        }

        function getPictureDisplayHTML(pictureURL, pictureDataURL, size = 80) {
            if (pictureDataURL) {
                return `<img src="${pictureDataURL}" alt="Photo" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:50%;border:3px solid var(--primary);">`;
            }
            if (pictureURL) {
                const escapedURL = pictureURL.replace(/'/g, "\\'");
                return `<img src="${pictureURL}" alt="Photo" onerror="(function(img){if(img.src.startsWith('https://corsproxy.io/?')){img.onerror=null;img.style.display='none';img.insertAdjacentHTML('afterend','<span class=\\'result-photo-placeholder\\'>📷</span>');return;}img.src='https://corsproxy.io/?'+encodeURIComponent('${escapedURL}');img.onerror=function(){this.style.display='none';this.insertAdjacentHTML('afterend','<span class=\\'result-photo-placeholder\\'>📷</span>');};})(this)" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:50%;border:3px solid var(--primary);">`;
            }
            return `<span class="result-photo-placeholder" style="width:${size}px;height:${size}px;">📷</span>`;
        }

        function createParticles() {
            const container = document.getElementById('bgParticles');
            for (let i = 0; i < 35; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 80 + 20;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 18 + 10 + 's';
                particle.style.animationDelay = Math.random() * 15 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        function renderApp() {
            const portal = AppState.currentPortal;
            if (!portal) { renderLandingPage(); return; }
            switch (portal) {
                case 'student-reg':
                    renderStudentRegistration();
                    break;
                case 'student-assist':
                    renderStudentAssistant();
                    break;
                case 'admin-assist':
                    renderAdminAssistant();
                    break;
                case 'admin':
                    renderAdminPortal();
                    break;
                case 'eval-committee':
                    renderEvalCommittee();
                    break;
                default:
                    renderLandingPage();
            }
        }

        function navigateTo(portal) {
            if (AppState.realtimeResultsListener) {
                AppState.realtimeResultsListener();
                AppState.realtimeResultsListener = null;
            }
            AppState.pendingCroppedBlob = null;
            AppState.pendingCroppedDataURL = null;
            AppState.currentPortal = portal;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function uploadToTelegram(file) {
            const formData = new FormData();
            formData.append('image', file);
            const response = await fetch(TELEGRAM_WORKER_URL, { method: 'POST', body: formData });
            const result = await response.json();
            if (result.success) return result.url;
            throw new Error('Telegram upload failed: ' + (result.error || 'Unknown error'));
        }

        async function saveSuccessCardToGallery(regID, studentName, localPictureDataURL) {
            try {
                const saveBtn = document.getElementById('saveToGalleryBtn');
                if (saveBtn) {
                    saveBtn.disabled = true;
                    saveBtn.innerHTML = '⏳ Generating Image...';
                }
                const cleanDiv = document.getElementById('cleanCardContainer');
                if (!cleanDiv) throw new Error('Clean card container missing');
                cleanDiv.style.display = 'block';
                await new Promise(resolve => setTimeout(resolve, 200));
                const canvas = await html2canvas(cleanDiv, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    logging: false,
                    useCORS: true,
                    allowTaint: true
                });
                cleanDiv.style.display = 'none';
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1.0));
                if (navigator.share && navigator.canShare) {
                    const file = new File([blob], `RJFSE26_Registration_${regID}.png`, { type: 'image/png' });
                    const shareData = {
                        files: [file],
                        title: 'RJFSE26 Registration Card',
                        text: `Registration Card for ${studentName} - ID: ${regID}`
                    };
                    if (navigator.canShare(shareData)) {
                        await navigator.share(shareData);
                        showToast('✅ Card saved to gallery!', 'success');
                        if (saveBtn) {
                            saveBtn.disabled = false;
                            saveBtn.innerHTML = '💾 Save to Gallery';
                        }
                        return;
                    }
                }
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `RJFSE26_Registration_${regID}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('✅ Registration card downloaded as PNG!', 'success');
                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '💾 Save to Gallery';
                }
            } catch (error) {
                console.error('Save to gallery error:', error);
                showToast('❌ Could not save: ' + error.message, 'error');
                const saveBtn = document.getElementById('saveToGalleryBtn');
                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '💾 Save to Gallery';
                }
            }
        }

        function showCropModal(imageDataURL, originalFile) {
            const existing = document.getElementById('cropModal');
            if (existing) existing.remove();
            const modalHTML = `
            <div class="modal-overlay" id="cropModal" onclick="if(event.target===this)this.remove()">
              <div class="modal cropper-modal">
                <h3 style="margin-bottom:12px;">✂️ Crop Picture (1:1)</h3>

                </div>
                <div class="cropper-actions">
                  <button class="btn btn-primary btn-sm" onclick="cropAndSave()">✅ Crop & Use</button>
                  <button class="btn btn-ghost btn-sm" onclick="document.getElementById('cropModal').remove()">Cancel</button>
                </div>
              </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            const image = document.getElementById('cropImage');
            if (!image) return;
            const cropper = new Cropper(image, {
                aspectRatio: 1,
                viewMode: 1,
                autoCropArea: 1,
                responsive: true,
                guides: true,
                background: false,
            });
            window._currentCropper = cropper;
            window._originalFile = originalFile;
        }

                const croppedDataURL = canvas.toDataURL('image/jpeg', 0.9);

                const preview = document.getElementById('regPreview');

                cropper.destroy();
                window._currentCropper = null;
                window._originalFile = null;
                showToast('Picture cropped successfully!', 'success');
            }, 'image/jpeg', 0.9);
        }

        function switchSATab(tab, btn) {
            document.querySelectorAll('#root .tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const manualEl = document.getElementById('saManualSearch');
            const qrEl = document.getElementById('saQRSearch');
            if (manualEl) manualEl.style.display = tab === 'manual' ? 'block' : 'none';
            if (qrEl) qrEl.style.display = tab === 'qr' ? 'block' : 'none';
            if (tab === 'qr') initSAQRScanner();
            else stopSAQRScanner();
        }

        function initSAQRScanner() {
            const readerEl = document.getElementById('saQRReader');
            if (!readerEl || window._saQRScanner) return;
            readerEl.innerHTML = '';
            const scanner = new Html5Qrcode('saQRReader');
            window._saQRScanner = scanner;
            const stopBtn = document.getElementById('saStopQR');
            if (stopBtn) stopBtn.style.display = 'block';
            scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                    document.getElementById('saSearchInput').value = decodedText;
                    stopSAQRScanner();
                    searchStudentAssistant();
                },
                () => { }
            ).catch(() => {
                showToast('Camera access denied. Please use manual search.', 'error');
                if (stopBtn) stopBtn.style.display = 'none';
            });
        }

        function stopSAQRScanner() {
            if (window._saQRScanner) {
                window._saQRScanner.stop().catch(() => { });
                window._saQRScanner = null;
            }
            const stopBtn = document.getElementById('saStopQR');
            if (stopBtn) stopBtn.style.display = 'none';
            const readerEl = document.getElementById('saQRReader');
            if (readerEl) readerEl.innerHTML =
                '<p class="text-center" style="color:var(--text-light);">Scanner stopped.</p>';
        }

        async function searchStudentAssistant() {
            const input = document.getElementById('saSearchInput').value.trim();
            const resultDiv = document.getElementById('saResult');
            if (!input) {
                resultDiv.innerHTML =
                    '<p style="color:var(--danger);text-align:center;">Please enter a Registration ID or Mobile Number.</p>';
                return;
            }
            resultDiv.innerHTML = '<div class="spinner"></div>';
            try {
                let docSnap;
                if (input.startsWith('RJFSE26-')) {
                    docSnap = await db.collection('students').doc(input).get();
                } else {
                    const querySnap = await db.collection('students').where('mobile', '==', input).limit(1).get();
                    docSnap = querySnap.empty ? null : querySnap.docs[0];
                }
                if (!docSnap || !docSnap.exists) {
                    const rtdbSnap = await rtdb.ref('students').orderByChild('mobile').equalTo(input).once('value');
                    if (rtdbSnap.exists()) {
                        const data = Object.values(rtdbSnap.val())[0];
                        docSnap = { exists: true, data: () => data, id: data.registrationID };
                    }
                }
                if (!docSnap || !docSnap.exists) {
                    resultDiv.innerHTML =
                        '<p style="color:var(--danger);text-align:center;">❌ No student found with this information.</p>';
                    return;
                }
                const student = docSnap.data();
                const regID = docSnap.id || student.registrationID;
                const statusColor = student.present ? 'badge-success' : student.checkedIn ? 'badge-info' :
                    'badge-warning';
                const statusText = student.present ? 'Present' : student.checkedIn ? 'Checked In' : 'Registered';
                const pictureHTML = getPictureDisplayHTML(student.pictureURL, student.pictureDataURL, 80);

        async function loadAdminDashboardStats() {
            try {
                const snap = await db.collection('students').get();
                const students = [];
                snap.forEach(d => students.push({ id: d.id, ...d.data() }));
                const asstSnap = await db.collection('adminAssistants').get();

                asstSnap.forEach(d => assistants.push({ id: d.id, ...d.data() }));
                const volSnap = await db.collection('volunteers').get();
                const volunteers = [];
                volSnap.forEach(d => volunteers.push({ id: d.id, ...d.data() }));
                AppState.allStudents = students;
                AppState.allAssistants = assistants;
                AppState.allVolunteers = volunteers;
                AppState.stats = {
                    total: students.length,
                    class8: students.filter(s => s.class === '8').length,
                    class9: students.filter(s => s.class === '9').length,
                    class10: students.filter(s => s.class === '10').length,
                    present: students.filter(s => s.present).length,
                    present8: students.filter(s => s.class === '8' && s.present).length,
                    present9: students.filter(s => s.class === '9' && s.present).length,
                    present10: students.filter(s => s.class === '10' && s.present).length,
                    absent: students.filter(s => !s.present).length,
                    completed: students.filter(s => s.status === 'Completed').length,
                    totalAssistants: assistants.length,
                    totalVolunteers: volunteers.length,
                };
            } catch (e) {
                console.error('Stats load error:', e);
                AppState.stats = {
                    total: 0, class8: 0, class9: 0, class10: 0, present: 0, present8: 0, present9: 0,
                    present10: 0, absent: 0, completed: 0, totalAssistants: 0, totalVolunteers: 0
                };
                AppState.allStudents = [];
                AppState.allAssistants = [];
                AppState.allVolunteers = [];
            }
        }

        function switchAdminTab(tab, btn) {
            document.querySelectorAll('#root .tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const content = document.getElementById('adminTabContent');
            if (!content) return;
            const stats = AppState.stats || {};
            const students = AppState.allStudents || [];
            const assistants = AppState.allAssistants || [];
            const volunteers = AppState.allVolunteers || [];
            switch (tab) {
                case 'dashboard':
                    content.innerHTML = `
                <div class="card-grid">
                  <div class="card stat-card"><div class="stat-number">${stats.total || 0}</div><div class="stat-label">Total Registered</div></div>
                  <div class="card stat-card"><div class="stat-number">${stats.class8 || 0}</div><div class="stat-label">Class 8</div></div>
                  <div class="card stat-card"><div class="stat-number">${stats.class9 || 0}</div><div class="stat-label">Class 9</div></div>
                  <div class="card stat-card"><div class="stat-number">${stats.class10 || 0}</div><div class="stat-label">Class 10</div></div>
                </div>
                <div class="card-grid mt-3">
                  <div class="card stat-card" style="background:#e8f5e9;"><div class="stat-number" style="color:#2e7d32;">${stats.present || 0}</div><div class="stat-label">Total Present</div></div>
                  <div class="card stat-card" style="background:#fff3e0;"><div class="stat-number" style="color:#e65100;">${stats.absent || 0}</div><div class="stat-label">Total Absent</div></div>
                  <div class="card stat-card" style="background:#e1f5fe;"><div class="stat-number" style="color:#0277bd;">${stats.completed || 0}</div><div class="stat-label">Completed</div></div>
                </div>
                <div class="card-grid mt-3">
                  <div class="card stat-card"><div class="stat-number">${stats.present8 || 0}</div><div class="stat-label">Class 8 Present</div></div>
                  <div class="card stat-card"><div class="stat-number">${stats.present9 || 0}</div><div class="stat-label">Class 9 Present</div></div>
                  <div class="card stat-card"><div class="stat-number">${stats.present10 || 0}</div><div class="stat-label">Class 10 Present</div></div>
                </div>
                <div class="card-grid mt-3">
                  <div class="card stat-card" style="background:#fce4ec;"><div class="stat-number" style="color:#c62828;">${stats.totalAssistants || 0}</div><div class="stat-label">Active Assistants</div></div>
                  <div class="card stat-card" style="background:#f3e5f5;"><div class="stat-number" style="color:#6a1b9a;">${stats.totalVolunteers || 0}</div><div class="stat-label">Total Volunteers</div></div>
                </div>`;
                    break;

                case 'students':
                    const sortedByDate = [...students].sort((a, b) => {
                        const getTs = (s) => {
                            const ts = s.registrationTimestamp || s.createdAt;
                            if (!ts) return 0;
                            if (ts.seconds) return ts.seconds * 1000;
                            if (typeof ts === 'number') return ts;
                            if (ts.toDate) return ts.toDate().getTime();
                            return new Date(ts).getTime();
                        };
                        return getTs(a) - getTs(b);
                    });

                    const classGroups = { '8': [], '9': [], '10': [], 'other': [] };
                    sortedByDate.forEach(s => {
                        const cls = s.class;
                        if (classGroups[cls]) classGroups[cls].push(s);
                        else classGroups['other'].push(s);

        function startAdminStudentQRScan() {

            if (stopBtn) stopBtn.style.display = 'block';
            scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {

                showToast('Camera access denied', 'error');

        }

        async function refreshAdminResultsTable() {
            const container = document.getElementById('adminResultsContainer');
            const sortBy = document.getElementById('adminResultSort')?.value || 'score';
            if (!container) return;
            try {
                const snap = await db.collection('students').where('result.score', '>=', 0).get();
                const results = [];
                snap.forEach(d => {
                    const data = d.data();
                    if (data.result) results.push({ id: d.id, ...data });
                });
                results.sort((a, b) => sortBy === 'roll' ? (a.classRoll || '').localeCompare(b.classRoll || '') : (b
                    .result.score || 0) - (a.result.score || 0));
                if (results.length === 0) {
                    container.innerHTML =
                        '<p class="text-center" style="color:var(--text-light);padding:20px;">No results uploaded yet.</p>';
                    return;
                }
                const classGroups = { '8': [], '9': [], '10': [], 'other': [] };
                results.forEach(r => {
                    const cls = r.class;
                    if (classGroups[cls]) classGroups[cls].push(r);
                    else classGroups['other'].push(r);
                });
                Object.keys(classGroups).forEach(cls => {
                    classGroups[cls].sort((a, b) => (b.result.score || 0) - (a.result.score || 0));
                });
                let html = '';
                const classOrder = ['8', '9', '10', 'other'];
                const classLabels = {
                    '8': '📚 Class 8',
                    '9': '📚 Class 9',
                    '10': '📚 Class 10',
                    'other': '📚 Other'
                };
                const medalEmojis = ['🥇', '🥈', '🥉'];
                classOrder.forEach(cls => {
                    const group = classGroups[cls];
                    if (group.length === 0) return;
                    html +=
                        `<div class="class-section-header" style="margin-top:20px;">${classLabels[cls]} — ${group.length} Results</div>`;
                    html += `<div class="table-container"><table><thead><tr>
                <th>Pos</th><th>Picture</th><th>Name</th><th>Roll</th><th>Answer Sheet ID</th><th>Score</th><th>Reg ID</th>
              </tr></thead><tbody>`;
                    group.forEach((r, i) => {
                        const medal = i < 3 ? medalEmojis[i] + ' ' : '';
                        const pictureHTML = getPictureDisplayHTML(r.pictureURL, r.pictureDataURL,
                            36);
                        html += `
                  <tr>
                    <td><strong>${medal}${i + 1}</strong></td>
                    <td>${pictureHTML}</td>
                    <td>${escapeHTML(r.name)}</td>
                    <td>${r.classRoll || 'N/A'}</td>
                    <td>${r.result.answerSheetId || 'N/A'}</td>
                    <td><strong style="font-size:1.1rem;color:var(--accent);">${r.result.score}</strong></td>
                    <td><span class="badge badge-primary">${r.id || r.registrationID}</span></td>
                  </tr>`;
                    });
                    html += '</tbody></table></div>';
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML =
                    `<p class="text-center" style="color:var(--danger);">Error: ${e.message}</p>`;
            }
        }

        function filterStudentTable() {
            const searchTerm = (document.getElementById('studentSearch')?.value || '').toLowerCase();
            const classFilter = document.getElementById('studentClassFilter')?.value || 'all';
            const table = document.getElementById('studentTable');
            if (!table) return;
            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                if (row.classList.contains('class-section-row')) {
                    let nextRow = row.nextElementSibling;
                    let anyVisible = false;
                    while (nextRow && !nextRow.classList.contains('class-section-row')) {
                        const text = nextRow.textContent.toLowerCase();
                        const cls = nextRow.cells[3]?.textContent || '';
                        const matchSearch = !searchTerm || text.includes(searchTerm);
                        const matchClass = classFilter === 'all' || cls === classFilter;
                        if (matchSearch && matchClass) anyVisible = true;
                        nextRow = nextRow.nextElementSibling;
                    }
                    row.style.display = anyVisible ? '' : 'none';
                } else {
                    const text = row.textContent.toLowerCase();
                    const cls = row.cells[3]?.textContent || '';
                    const matchSearch = !searchTerm || text.includes(searchTerm);
                    const matchClass = classFilter === 'all' || cls === classFilter;
                    row.style.display = matchSearch && matchClass ? '' : 'none';
                }
            });
        }

        async function generatePDFReport(type) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const students = AppState.allStudents || [];
            let filtered = [];
            let title = '';

            // Helper to extract registration timestamp (works for Firestore Timestamp, Date, number, string)
            function getRegistrationTimestamp(s) {
                const ts = s.registrationTimestamp || s.createdAt;
                if (!ts) return 0;
                if (ts.seconds) return ts.seconds * 1000;            // Firestore Timestamp
                if (typeof ts === 'number') return ts;
                if (ts.toDate) return ts.toDate().getTime();          // Firestore Timestamp (old)
                if (ts instanceof Date) return ts.getTime();
                return new Date(ts).getTime();
            }

            // Sort filtered array by registration time (oldest first)
            function sortByRegistrationTime(arr) {
                return arr.sort((a, b) => getRegistrationTimestamp(a) - getRegistrationTimestamp(b));
            }

            switch (type) {
                case 'all':
                    filtered = students.slice(); // copy
                    title = 'All Registered Students';
                    break;
                case 'present':
                    filtered = students.filter(s => s.present);
                    title = 'Present Students';
                    break;
                case 'absent':
                    filtered = students.filter(s => !s.present);
                    title = 'Absent Students';
                    break;
                case 'completed':
                    filtered = students.filter(s => s.status === 'Completed');
                    title = 'Completed Students';
                    break;
                case 'class8':
                    filtered = students.filter(s => s.class === '8');
                    title = 'Class 8 Students';
                    break;
                case 'class9':
                    filtered = students.filter(s => s.class === '9');
                    title = 'Class 9 Students';
                    break;
                case 'class10':
                    filtered = students.filter(s => s.class === '10');
                    title = 'Class 10 Students';
                    break;
                default:
                    filtered = students.slice();
                    title = 'Students Report';
            }

            // ✅ Apply registration serial sorting (oldest first)
            filtered = sortByRegistrationTime(filtered);

            doc.setFontSize(16);
            doc.setTextColor(26, 35, 126);

        // ===================================================================
        //  🪑 SEAT TOKEN PDF GENERATOR — Registration Serial Sorting (Oldest First)
        //  Size: 9cm × 6cm  |  8 tokens per A4 page (2 cols × 4 rows)
        //  Clean, non‑overlapping text with proper spacing & sorting.
        // ===================================================================
        async function generateSeatTokensPDF(targetClass = 'all') {
            showToast(`Generating ${targetClass === 'all' ? 'All' : 'Class ' + targetClass} Seat Tokens...`, 'info');
            try {
                let students = AppState.allStudents || [];
                if (students.length === 0) {
                    await loadAdminDashboardStats();
                    students = AppState.allStudents || [];
                }
                if (targetClass !== 'all') {
                    students = students.filter(s => String(s.class || '').trim() === String(targetClass).trim());
                }
                if (students.length === 0) {
                    showToast(`No students found for ${targetClass === 'all' ? 'any class' : 'Class ' + targetClass}.`, 'error');
                    return;
                }

                // --- Sort Students by Registration Time (Oldest first) ---
                const getTimestamp = (student) => {
                    const ts = student.registrationTimestamp || student.createdAt;
                    if (!ts) return 0;
                    if (ts.seconds !== undefined) return ts.seconds * 1000 + (ts.nanoseconds || 0) / 1e6;
                    if (typeof ts === 'number') return ts;
                    if (ts.toDate) return ts.toDate().getTime();
                    if (ts instanceof Date) return ts.getTime();
                    return new Date(ts).getTime();
                };
                students.sort((a, b) => getTimestamp(a) - getTimestamp(b));

                const { PDFDocument, rgb, StandardFonts } = PDFLib;
                const pdfDoc = await PDFDocument.create();

                // --- Constants ---
                const TOKEN_W = 90; // 9 cm
                const TOKEN_H = 60; // 6 cm
                const COLS = 2;
                const ROWS = 4;
                const PER_PAGE = COLS * ROWS; // 8

                // A4 portrait (mm)
                const PAGE_W = 210;
                const PAGE_H = 297;

                // Gaps to ensure completely separate borders
                const GAP_X = 10; // 1 cm gap between columns
                const GAP_Y = 12; // 1.2 cm gap between rows

                const TOTAL_GRID_W = (TOKEN_W * COLS) + (GAP_X * (COLS - 1));
                const TOTAL_GRID_H = (TOKEN_H * ROWS) + (GAP_Y * (ROWS - 1));

                const MARGIN_X = (PAGE_W - TOTAL_GRID_W) / 2; // Center horizontally
                const MARGIN_Y = (PAGE_H - TOTAL_GRID_H) / 2; // Center vertically

                const font = await pdfDoc.embedFont(StandardFonts.TimesRoman);
                const boldFont = await pdfDoc.embedFont(StandardFonts.TimesRomanBold);

                const primary = rgb(0.10, 0.14, 0.50);
                const accent = rgb(0.80, 0.33, 0.00);
                const dark = rgb(0.15, 0.15, 0.15);
                const gray = rgb(0.65, 0.65, 0.65);
                const bg = rgb(0.985, 0.985, 0.995);

                function safeStr(v) {
                    return (v === undefined || v === null || v === '') ? '-' : String(v).trim();
                }

                // Auto‑shrink helper
                function fitText(text, maxWidth, startSize, minSize, useFont) {
                    let size = startSize;
                    let display = text;
                    while (size > minSize && useFont.widthOfTextAtSize(display, size) > maxWidth) {
                        size -= 0.3;
                    }
                    if (size <= minSize) {
                        size = minSize;
                        while (display.length > 0 && useFont.widthOfTextAtSize(display + '…', size) > maxWidth) {
                            display = display.slice(0, -1);
                        }
                        display = display + '…';
                    }
                    return { text: display, size };
                }

                // Draw a label + value on the same line, auto‑shrinking the value
                function drawLabelValue(page, label, value, x, y, maxWidth, labelSize, valSize, font, boldFont) {
                    const lbl = label + ' ';
                    const lblW = boldFont.widthOfTextAtSize(lbl, labelSize);
                    const valMax = maxWidth - lblW - 1;
                    const fit = fitText(value, valMax, valSize, 3.0, font);
                    page.drawText(lbl, { x, y, size: labelSize, font: boldFont, color: dark });
                    page.drawText(fit.text, { x: x + lblW, y, size: fit.size, font, color: dark });
                    return { labelEndX: x + lblW + font.widthOfTextAtSize(fit.text, fit.size) };
                }

                // Draw two label+value pairs on the same line (left / right)
                function drawTwoLabels(page, leftLabel, leftVal, rightLabel, rightVal, x, y, halfWidth, labelSize, valSize, font, boldFont) {
                    const lLbl = leftLabel + ' ';
                    const lLblW = boldFont.widthOfTextAtSize(lLbl, labelSize);
                    const rLbl = rightLabel + ' ';
                    const rLblW = boldFont.widthOfTextAtSize(rLbl, labelSize);

                    // Left
                    const lMax = halfWidth - lLblW - 1;
                    const lFit = fitText(leftVal, lMax, valSize, 3.0, font);
                    page.drawText(lLbl, { x, y, size: labelSize, font: boldFont, color: dark });
                    page.drawText(lFit.text, { x: x + lLblW, y, size: lFit.size, font, color: dark });

                    // Right
                    const rMax = halfWidth - rLblW - 1;
                    const rFit = fitText(rightVal, rMax, valSize, 3.0, font);
                    const rX = x + halfWidth * 2 - rLblW - font.widthOfTextAtSize(rFit.text, rFit.size);
                    page.drawText(rLbl, { x: rX, y, size: labelSize, font: boldFont, color: dark });
                    page.drawText(rFit.text, { x: rX + rLblW, y, size: rFit.size, font, color: dark });
                }

                // --------------------  Build pages  --------------------
                for (let i = 0; i < students.length; i += PER_PAGE) {
                    const page = pdfDoc.addPage([PAGE_W, PAGE_H]);

                    for (let j = 0; j < PER_PAGE; j++) {
                        const student = students[i + j];
                        if (!student) break;

                        const col = j % COLS;
                        const row = Math.floor(j / COLS);

                        // Calculate X and Y coordinates (top to bottom with gaps)
                        const x = MARGIN_X + col * (TOKEN_W + GAP_X);
                        const y = PAGE_H - MARGIN_Y - TOKEN_H - (row * (TOKEN_H + GAP_Y));

                        // --- Token background & border ---
                        page.drawRectangle({
                            x, y,
                            width: TOKEN_W, height: TOKEN_H,
                            color: bg,
                            borderColor: primary,
                            borderWidth: 1.5,
                            borderRadius: 3,
                        });
                        page.drawRectangle({
                            x: x + 1.5, y: y + 1.5,
                            width: TOKEN_W - 3, height: TOKEN_H - 3,
                            borderColor: rgb(0.78, 0.80, 0.90),
                            borderWidth: 0.5,
                            borderRadius: 2,
                        });

                        const innerX = x + 4;
                        const innerW = TOKEN_W - 8;
                        const halfW = innerW / 2;

                        // Data
                        const name = safeStr(student.name);
                        const regId = safeStr(student.id || student.registrationID);
                        const roll = safeStr(student.classRoll);
                        const cls = safeStr(student.class);
                        const group = safeStr(student.group);
                        const dob = safeStr(student.dateOfBirth);
                        const room = safeStr(student.examRoomNumber);
                        const sit = safeStr(student.sitNumber);

                        // ---- Layout from top of token (y + TOKEN_H) ----
                        const topY = y + TOKEN_H;
                        const labelSize = 5.0;
                        const valSize = 5.5;
                        const rowGap = 5.6; // Adjusted gap for 60mm height

                        // 1. Header (Moved further down from border)
                        const header = 'RJF Scholarship Exam 2026';
                        const hSize = 5.8;
                        const hW = boldFont.widthOfTextAtSize(header, hSize);
                        page.drawText(header, {
                            x: x + (TOKEN_W - hW) / 2,
                            y: topY - 6.5, // ⬇️ Pushed down away from the border
                            size: hSize,
                            font: boldFont,
                            color: primary,
                        });

                        // 2. Divider
                        const div1Y = topY - 10.5; // Adjusted to match header position
                        page.drawLine({
                            start: { x: innerX, y: div1Y },
                            end: { x: x + TOKEN_W - 4, y: div1Y },
                            color: primary,
                            thickness: 0.7,
                        });

                        // 3. Name (Moved further down)
                        let curY = div1Y - 6.0; // ⬇️ Pushed Name field down

                        // Name (full width)
                        drawLabelValue(page, 'Name:', name, innerX, curY, innerW, labelSize, 6.0, font, boldFont);
                        curY -= rowGap;

                        // 4. Reg No (full width)
                        drawLabelValue(page, 'Reg No:', regId, innerX, curY, innerW, labelSize, valSize, font, boldFont);
                        curY -= rowGap;

                        // 5. Class | Group
                        drawTwoLabels(page, 'Class:', cls, 'Group:', group, innerX, curY, halfW, labelSize, valSize, font, boldFont);
                        curY -= rowGap;

                        // 6. Roll | DOB
                        drawTwoLabels(page, 'Roll:', roll, 'DOB:', dob, innerX, curY, halfW, labelSize, valSize, font, boldFont);
                        curY -= rowGap;

                        // 7. Exam Room | Sit No
                        drawTwoLabels(page, 'Exam Room:', room, 'Sit No:', sit, innerX, curY, halfW, labelSize, valSize, font, boldFont);
                        curY -= rowGap + 1.0;

                        // 8. Light divider
                        const div2Y = curY;
                        page.drawLine({
                            start: { x: innerX, y: div2Y },
                            end: { x: x + TOKEN_W - 4, y: div2Y },
                            color: gray,
                            thickness: 0.4,
                        });

                        // 9. Footer
                        const footer = 'Best Wishes For Your Exam';
                        const fSize = 5.5;
                        const fW = boldFont.widthOfTextAtSize(footer, fSize);
                        page.drawText(footer, {
                            x: x + (TOKEN_W - fW) / 2,
                            y: div2Y - 5.5,
                            size: fSize,
                            font: boldFont,
                            color: accent,
                        });
                    }
                }

                // --- Save and download ---
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                const fileName = targetClass === 'all' ?
                    'RJFSE26_All_Seat_Tokens.pdf' :
                    `RJFSE26_Class_${targetClass}_Seat_Tokens.pdf`;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('✅ Seat Tokens generated successfully! (8 per page, 9cm×6cm)', 'success');
            } catch (error) {
                console.error('Seat Token Generation Error:', error);
                showToast('❌ Failed to generate seat tokens. Check console.', 'error');
            }
        }

            e.preventDefault();
            if (document.getElementById('evalEmail').value.trim() === 'evaluator@rjfse26.com' && document.getElementById(
                'evalPassword').value.trim() === 'Eval@2026') {
                AppState.evalCommitteeAuth = { email: 'evaluator@rjfse26.com', role: 'Evaluator' };
                showToast('Evaluator login success!', 'success');
                renderEvalCommitteeDashboard();
            } else {
                document.getElementById('evalLoginError').innerHTML =
                    '<p style="color:var(--danger);">Invalid credentials.</p>';
            }
        }

        function renderEvalCommitteeDashboard() {
            AppState.resultUploadSession = { scannedAnswerSheetId: null, scannedStudentId: null, studentData: null };
            root.innerHTML = `
            <div class="app-header no-print">
              <div class="header-logo"><div class="logo-icon">RJF</div><div><div class="header-title">Evaluation Committee</div><div class="header-subtitle">Anonymous Marking System</div></div></div>
              <div class="header-actions">
                <button class="btn btn-outline btn-sm" onclick="logoutEval()">🚪 Logout</button>
                <button class="btn btn-outline btn-sm" onclick="navigateTo(null)">🏠 Home</button>
              </div>
            </div>
            <div class="card">
              <div style="background:#f3e5f5;padding:12px;border-radius:10px;margin-bottom:16px;text-align:center;border:2px solid #6a1b9a;">
                <span style="font-size:1.5rem;">🔒</span> <strong>ANONYMOUS MODE</strong> - Student identity hidden
              </div>
              <div style="background:#fff3e0;padding:12px;border-radius:10px;margin-bottom:16px;display:flex;align-items:center;gap:12px;">
                <span style="font-size:1.5rem;">⚠️</span><span><strong>Privacy:</strong> You cannot see the student's name. Only the answer sheet QR is used.</span>
              </div>
              <p style="margin-bottom:16px;">Step 1: Scan the answer sheet QR code.</p>
              <div id="evalStep1">
                <button class="btn btn-info w-full" onclick="startEvalAnswerSheetScan()">📷 Scan Answer Sheet QR</button>
                <div id="evalAnswerSheetQR" style="max-width:350px;margin:12px auto;"></div>
                <button class="btn btn-ghost btn-sm w-full mt-2" id="stopEvalAnsQR" style="display:none;" onclick="stopEvalAnswerSheetScanner()">⏹️ Stop</button>
                <div id="evalAnswerSheetInfo" style="margin-top:12px;"></div>
              </div>
              <div id="evalStep2" style="display:none;">
                <hr style="margin:16px 0;">
                <p>Step 2: Enter score.</p>
                <div style="background:#e8eaf6;padding:12px;border-radius:10px;margin-bottom:12px;text-align:center;">
                  📋 Answer Sheet: <strong id="evalDisplaySheetId"></strong>
                </div>
                <div class="form-group"><label>📊 Score *</label><input type="number" id="evalScore" placeholder="e.g. 85" min="0" max="200" required style="font-size:1.2rem;text-align:center;"></div>
                <div class="form-group"><label>💬 Comments</label><input type="text" id="evalComments" placeholder="Optional remarks"></div>
                <button class="btn btn-success w-full" onclick="uploadEvalResult()">✅ Upload Result</button>
                <div id="evalUploadStatus" style="margin-top:12px;"></div>
              </div>
            </div>`;
        }

        function startEvalAnswerSheetScan() {
            const qrDiv = document.getElementById('evalAnswerSheetQR');
            if (!qrDiv) return;
            qrDiv.innerHTML = '';
            const scanner = new Html5Qrcode('evalAnswerSheetQR');
            window._evalAnsScanner = scanner;
            const stopBtn = document.getElementById('stopEvalAnsQR');
            if (stopBtn) stopBtn.style.display = 'block';
            document.getElementById('evalAnswerSheetInfo').innerHTML =
                '<p style="color:var(--info);">⏳ Scanning answer sheet QR...</p>';
            scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } },
                async (decodedText) => {
                    stopEvalAnswerSheetScanner();
                    const sheetId = decodedText.trim();
                    const infoDiv = document.getElementById('evalAnswerSheetInfo');
                    infoDiv.innerHTML =
                        `<p style="color:var(--success);">✅ Scanned: <strong>${sheetId}</strong></p><p>Searching...</p>`;
                    try {
                        const qSnap = await db.collection('students').where('answerSheetNumber', '==', sheetId)
                            .limit(1).get();
                        if (qSnap.empty) {
                            infoDiv.innerHTML +=
                                '<p style="color:var(--danger);">❌ No student found with this answer sheet.</p>';
                            AppState.resultUploadSession = {
                                scannedAnswerSheetId: null, scannedStudentId: null,
                                studentData: null
                            };
                            return;
                        }
                        const doc = qSnap.docs[0];
                        AppState.resultUploadSession = {
                            scannedAnswerSheetId: sheetId, scannedStudentId: doc.id,
                            studentData: doc.data()
                        };
                        document.getElementById('evalDisplaySheetId').textContent = sheetId;
                        document.getElementById('evalStep2').style.display = 'block';
                        document.getElementById('evalScore').value = '';
                        document.getElementById('evalComments').value = '';
                        document.getElementById('evalUploadStatus').innerHTML = '';
                    } catch (e) {
                        infoDiv.innerHTML += `<p style="color:var(--danger);">Error: ${e.message}</p>`;
                    }
                },
                () => { }
            ).catch(() => {
                showToast('Camera error', 'error');
                if (stopBtn) stopBtn.style.display = 'none';
            });
        }

        function stopEvalAnswerSheetScanner() {
            if (window._evalAnsScanner) {
                window._evalAnsScanner.stop().catch(() => { });
                window._evalAnsScanner = null;
            }
            const stopBtn = document.getElementById('stopEvalAnsQR');
            if (stopBtn) stopBtn.style.display = 'none';
        }

        async function uploadEvalResult() {
            const session = AppState.resultUploadSession;
            if (!session || !session.scannedStudentId) { showToast('Scan answer sheet first.', 'error'); return; }
            const score = parseFloat(document.getElementById('evalScore').value);
            if (isNaN(score) || score < 0) { showToast('Enter valid score.', 'error'); return; }
            const statusDiv = document.getElementById('evalUploadStatus');
            statusDiv.innerHTML = '<div class="spinner"></div><p>Uploading...</p>';
            const resultData = {
                score,
                comments: document.getElementById('evalComments').value.trim() || '',
                answerSheetId: session.scannedAnswerSheetId,
                uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
                uploadedBy: 'Evaluation Committee'
            };
            try {
                await db.collection('students').doc(session.scannedStudentId).update({
                    result: resultData,
                    status: 'Result Published'
                });
                await rtdb.ref('students/' + session.scannedStudentId + '/result').set({
                    ...resultData,
                    uploadedAt: Date.now()
                });
                await rtdb.ref('students/' + session.scannedStudentId).update({ status: 'Result Published' });
                statusDiv.innerHTML =
                    '<div style="background:#e8f5e9;padding:16px;border-radius:10px;text-align:center;"><h4>✅ Uploaded!</h4><p>Score: <strong>' +
                    score + '</strong></p></div>';
                showToast('Result uploaded!', 'success');
                setTimeout(() => { renderEvalCommitteeDashboard(); }, 2000);
            } catch (e) { statusDiv.innerHTML = `<p style="color:var(--danger);">Error: ${e.message}</p>`; }
        }

        function logoutEval() {
            AppState.evalCommitteeAuth = null;
            stopEvalAnswerSheetScanner();
            renderApp();
            showToast('Logged out.', '');
        }

        // ===================================================================
        //  GLOBAL EXPOSURES (unchanged)
        // ===================================================================
        window.navigateTo = navigateTo;
        window.handleStudentRegistration = handleStudentRegistration;
        window.saveSuccessCardToGallery = saveSuccessCardToGallery;
        window.switchSATab = switchSATab;
        window.searchStudentAssistant = searchStudentAssistant;
        window.stopSAQRScanner = stopSAQRScanner;
        window.handleAdminAssistLogin = handleAdminAssistLogin;
        window.logoutAdminAssist = logoutAdminAssist;
        window.switchAATab = switchAATab;
        window.searchAAStudent = searchAAStudent;
        window.markAAPresent = markAAPresent;
        window.openAnswerSheetScan = openAnswerSheetScan;
        window.stopAnswerSheetScanner = stopAnswerSheetScanner;
        window.confirmAnswerSheet = confirmAnswerSheet;
        window.loadAAAssignedStudents = loadAAAssignedStudents;
        window.handleAdminLogin = handleAdminLogin;
        window.logoutAdmin = logoutAdmin;
        window.switchAdminTab = switchAdminTab;
        window.filterStudentTable = filterStudentTable;
        window.openStudentDetailModal = openStudentDetailModal;
        window.updateStudentDetail = updateStudentDetail;
        window.openAddAssistantModal = openAddAssistantModal;
        window.handleAddAssistant = handleAddAssistant;
        window.openAddVolunteerModal = openAddVolunteerModal;
        window.handleAddVolunteer = handleAddVolunteer;
        window.generatePDFReport = generatePDFReport;
        window.refreshAdminResultsTable = refreshAdminResultsTable;
        window.handleEvalLogin = handleEvalLogin;
        window.logoutEval = logoutEval;
        window.startEvalAnswerSheetScan = startEvalAnswerSheetScan;
        window.stopEvalAnswerSheetScanner = stopEvalAnswerSheetScanner;
        window.uploadEvalResult = uploadEvalResult;
        window.handlePictureFileSelect = handlePictureFileSelect;
        window.cropAndSave = cropAndSave;
        window.handleClassChange = handleClassChange;
        window.generateAllAdmitCardsPDF = generateAllAdmitCardsPDF;
        window.generateSingleAdmitCardPDF = generateSingleAdmitCardPDF;
        window.generateSeatTokensPDF = generateSeatTokensPDF;
        window.startAdminStudentQRScan = startAdminStudentQRScan;
        window.stopAdminStudentQRScanner = stopAdminStudentQRScanner;
        window.formatRegistrationTime = formatRegistrationTime;

        window.forceEnglishOnly = function (inputElement) {
            const originalValue = inputElement.value;
            const regex = /[^a-zA-Z0-9\s.,'-]/g;
            if (regex.test(originalValue)) {
                inputElement.value = originalValue.replace(regex, '');
                const warningText = inputElement.parentElement.querySelector('.english-warning');
                if (warningText) {
                    warningText.style.display = 'block';
                    clearTimeout(inputElement.warningTimer);
                    inputElement.warningTimer = setTimeout(() => {
                        warningText.style.display = 'none';
                    }, 3000);
                }
            }
        };

        // ===================================================================
        //  INIT
        // ===================================================================
        function initApp() {
            if (initialLoader) initialLoader.style.display = 'none';
            renderLandingPage();
        }
        document.addEventListener('DOMContentLoaded', initApp);
        if (document.readyState !== 'loading') initApp();
    </script>
</body>
